version: "3.9"

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile

    image: portfolio:latest
    container_name: portfolio-container

    command: npm run dev

    ports:
      - "3000:3000"

    env_file:
      - .env.local

    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

    restart: unless-stopped